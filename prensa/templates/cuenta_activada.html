<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Cuenta Activada Exitosamente!</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* --- VARIABLES CSS (Las mismas de tu estilo) --- */
        :root {
            --color-primary: #0f1f3d; 
            --color-accent: #c5a47e; 
            --color-bg-light: #f9f9f9;
            --color-text-dark: #2c2c2c;
            --color-white: #ffffff;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--color-bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: var(--color-text-dark);
        }

        .success-container {
            background-color: var(--color-white);
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 450px;
            width: 90%;
            border-top: 6px solid var(--color-primary);
            animation: fadeInUp 0.6s ease-out forwards;
            transform: translateY(20px);
            opacity: 0;
        }

        @keyframes fadeInUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .icon-wrapper {
            width: 80px;
            height: 80px;
            background-color: rgba(197, 164, 126, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
        }

        .icon-wrapper i {
            font-size: 35px;
            color: var(--color-accent);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--color-primary);
            margin-bottom: 15px;
            font-size: 2rem;
        }

        p {
            line-height: 1.6;
            color: #555;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .email-highlight {
            font-weight: 600;
            color: var(--color-primary);
            background-color: rgba(15, 31, 61, 0.05);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .btn-home {
            display: inline-block;
            background-color: var(--color-primary);
            color: var(--color-white);
            padding: 14px 30px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(15, 31, 61, 0.2);
        }

        .btn-home:hover {
            background-color: #002244;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(15, 31, 61, 0.3);
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="icon-wrapper">
            <i class="fas fa-check-circle"></i>
        </div>
        <h1>¡Acceso Autorizado!</h1>
        <p>El periodista con el correo <span class="email-highlight">{{ email_usuario }}</span> ha sido activado exitosamente.</p>
        <p style="font-size: 0.85rem; color: #888;">Se ha enviado un correo automático con sus credenciales de acceso a la Sala de Prensa.</p>
        <a href="{% url 'inicio' %}" class="btn-home">Regresar al Inicio</a>
    </div>
</body>
</html>
