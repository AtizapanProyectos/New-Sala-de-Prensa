{% extends 'base.html' %}
{% load static %}

{% block title %}Agenda Pública | Atizapán{% endblock %}

{% block content %}
<style>
    /* --- ESTILO FRANCÉS MEJORADO --- */
    .agenda-container {
        background-color: #FAF6F0;
        min-height: 100vh;
        padding: 60px 50px;
        border-radius: 10px;
    }

    .agenda-header p { font-size: 0.9rem; letter-spacing: 5px; text-transform: uppercase; color: var(--color-accent); margin-bottom: 15px; font-weight: 600; text-align: center; }
    .agenda-header h1 { font-family: 'Playfair Display', serif; font-size: 3.5rem; color: var(--color-primary); font-style: italic; text-align: center; margin-bottom: 50px;}

    .calendar-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid rgba(197, 164, 126, 0.3); }
    .nav-btn-cal { background: transparent; border: 1px solid var(--color-accent); color: var(--color-primary); padding: 10px 25px; border-radius: 30px; cursor: pointer; transition: all 0.4s; font-family: 'Montserrat', sans-serif; text-transform: uppercase; letter-spacing: 2px; font-size: 0.75rem; }
    .nav-btn-cal:hover { background-color: var(--color-accent); color: #fff; }
    #monthDisplay { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: var(--color-text-dark); }

    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 15px; }
    .day-column { background: #ffffff; border-top: 4px solid var(--color-primary); border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.04); min-height: 600px; display: flex; flex-direction: column; }
    .day-header { text-align: center; padding: 20px 10px; border-bottom: 1px solid #f0f0f0; background-color: #fdfdfd; border-radius: 8px 8px 0 0; }
    .day-name { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #888; }
    .day-number { display: block; font-family: 'Playfair Display', serif; font-size: 2.5rem; color: var(--color-primary); margin-top: 5px; }
    .day-content { padding: 15px 10px; flex-grow: 1; overflow-y: auto; background: #FAF6F0; opacity: 0.7;}
    .day-column.current-week .day-content { background: #ffffff; opacity: 1;} /* Resalta columnas con datos */

    /* Tarjetas de Eventos */
    .card { background: #fff; border-left: 4px solid var(--color-accent); padding: 15px; margin-bottom: 15px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.03); border-radius: 0 6px 6px 0;}
    .card:hover { transform: scale(1.02); box-shadow: 0 8px 20px rgba(197, 164, 126, 0.2); border-left: 4px solid var(--color-primary); }
    .card-thumb { width: 100%; height: 120px; object-fit: cover; border-radius: 4px; margin-bottom: 12px; }
    .card-tag { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; color: var(--color-accent); font-weight: bold; display: block; margin-bottom: 8px; }
    .card-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--color-primary); margin-bottom: 10px; line-height: 1.2; }
    .card-time { font-size: 0.8rem; color: #666; font-weight: 500;}

    /* Modal Ultra Elegante */
    .modal-fr { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 31, 61, 0.9); z-index: 10000; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
    .modal-fr.active { display: flex; }
    .modal-content-fr { background: #FAF6F0; padding: 50px; max-width: 800px; width: 95%; max-height: 90vh; overflow-y: auto; border-radius: 6px; position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.3); }
    
    .btn-descarga { display: inline-block; background: var(--color-primary); color: white; padding: 12px 25px; border-radius: 4px; text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem; font-weight: bold; margin-top: 20px; transition: background 0.3s; }
    .btn-descarga:hover { background: var(--color-accent); color: white;}
    /* Estilo para el botón del Pack ZIP */
    .btn-pack { display: inline-block; background: var(--color-accent); color: white; padding: 12px 25px; border-radius: 4px; text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem; font-weight: bold; margin-top: 20px; margin-left: 10px; transition: background 0.3s; box-shadow: 0 4px 10px rgba(197, 164, 126, 0.3); }
    .btn-pack:hover { background: #a87b25; color: white; transform: translateY(-2px);}
    
    /* Galería interna del Modal */
    .modal-galeria { display: flex; gap: 10px; margin-top: 20px; overflow-x: auto; padding-bottom: 10px;}
    .modal-galeria img { width: 120px; height: 80px; object-fit: cover; border-radius: 4px; border: 2px solid #ddd; cursor: pointer; transition: border 0.3s;}
    .modal-galeria img:hover { border: 2px solid var(--color-accent); }
</style>

<div class="agenda-container">
    <header class="agenda-header">
        <p>Agenda Institucional</p>
        <h1>Eventos de la Semana</h1>
    </header>

    <div class="calendar-controls">
        <button class="nav-btn-cal" onclick="changeWeek(-1)"><i class="fas fa-chevron-left"></i> Anterior</button>
        <h2 id="monthDisplay">Marzo 2026</h2>
        <button class="nav-btn-cal" onclick="changeWeek(1)">Siguiente <i class="fas fa-chevron-right"></i></button>
    </div>

    <div class="calendar-grid" id="calendarGrid">
        <div class="day-column current-week" id="col-0"><div class="day-header"><span class="day-name">Lunes</span><span class="day-number" id="date-0">--</span></div><div class="day-content"></div></div>
        <div class="day-column current-week" id="col-1"><div class="day-header"><span class="day-name">Martes</span><span class="day-number" id="date-1">--</span></div><div class="day-content"></div></div>
        <div class="day-column current-week" id="col-2"><div class="day-header"><span class="day-name">Miércoles</span><span class="day-number" id="date-2">--</span></div><div class="day-content"></div></div>
        <div class="day-column current-week" id="col-3"><div class="day-header"><span class="day-name">Jueves</span><span class="day-number" id="date-3">--</span></div><div class="day-content"></div></div>
        <div class="day-column current-week" id="col-4"><div class="day-header"><span class="day-name">Viernes</span><span class="day-number" id="date-4">--</span></div><div class="day-content"></div></div>
        <div class="day-column current-week" id="col-5"><div class="day-header"><span class="day-name">Sábado</span><span class="day-number" id="date-5">--</span></div><div class="day-content"></div></div>
        <div class="day-column current-week" id="col-6"><div class="day-header"><span class="day-name">Domingo</span><span class="day-number" id="date-6">--</span></div><div class="day-content"></div></div>
    </div>
</div>

<div class="modal-fr" id="detailModal">
    <div class="modal-content-fr">
        <span onclick="toggleModal('detailModal')" style="position:absolute; top:20px; right:30px; font-size:1.5rem; cursor:pointer; color:#999;">&times;</span>
        
        <p id="det-tag" style="font-size: 0.8rem; letter-spacing: 3px; color: var(--color-accent); font-weight: 700; margin-bottom: 15px; text-transform: uppercase;"></p>
        <h2 id="det-title" style="font-family: 'Playfair Display'; font-size: 2.5rem; color: var(--color-primary); margin-bottom: 20px; line-height: 1.1;"></h2>
        
        <div id="det-descargas" style="margin-bottom: 25px;"></div>

        <img id="det-img" src="" alt="Portada" style="width: 100%; max-height: 400px; object-fit: cover; border-radius: 8px; margin-bottom: 20px; display: none; box-shadow: 0 10px 20px rgba(0,0,0,0.1);">

        <p id="det-desc" style="line-height: 1.8; color: #444; font-size: 1.1rem; margin-bottom: 30px; border-left: 4px solid var(--color-accent); padding-left: 20px;"></p>
        
        <h4 id="galeria-title" style="display:none; font-family: 'Montserrat'; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 2px; color: var(--color-primary);">Material Fotográfico</h4>
        <div id="det-galeria" class="modal-galeria"></div>

        <div style="border-top: 1px solid #ddd; padding-top: 20px; margin-top: 30px; font-size: 0.95rem; display: flex; gap: 30px;">
            <p id="det-time" style="font-weight: 600; color: var(--color-primary);"></p>
            <p id="det-cobertura" style="color: var(--color-accent); font-weight: 600;"></p>
        </div>
    </div>
</div>

<script>
    let events = {{ eventos_json|safe }};
    let hoy = new Date();
    let diaSemana = hoy.getDay(); 
    let diferencia = hoy.getDate() - diaSemana + (diaSemana === 0 ? -6 : 1);
    let currentMonday = new Date(hoy.setDate(diferencia));

    function updateCalendar() {
        const months = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
        
        for(let i=0; i<7; i++) {
            let d = new Date(currentMonday);
            d.setDate(currentMonday.getDate() + i);
            let dateStr = d.toISOString().split('T')[0];
            
            document.getElementById(`date-${i}`).innerText = d.getDate().toString().padStart(2, '0');
            const container = document.querySelector(`#col-${i} .day-content`);
            container.innerHTML = '';
            
            events.filter(e => e.date === dateStr).forEach(ev => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openDetail(ev);
                
                let imagenHtml = ev.imagen ? `<img src="${ev.imagen}" class="card-thumb" alt="Miniatura">` : '';

                card.innerHTML = `
                    ${imagenHtml}
                    <span class="card-tag">${ev.tag}</span>
                    <h3 class="card-title">${ev.title}</h3>
                    <p class="card-time"><i class="far fa-clock"></i> ${ev.time}</p>
                `;
                container.appendChild(card);
            });
        }
        document.getElementById('monthDisplay').innerText = `${months[currentMonday.getMonth()]} ${currentMonday.getFullYear()}`;
    }

    function changeWeek(dir) { currentMonday.setDate(currentMonday.getDate() + (dir * 7)); updateCalendar(); }
    function toggleModal(id) { document.getElementById(id).classList.toggle('active'); }

    function openDetail(ev) {
        document.getElementById('det-tag').innerText = ev.tag;
        document.getElementById('det-title').innerText = ev.title;
        document.getElementById('det-desc').innerText = ev.desc;
        document.getElementById('det-desc').innerText = ev.contenido;
        document.getElementById('det-time').innerHTML = '<i class="far fa-clock"></i> ' + ev.time;
        document.getElementById('det-cobertura').innerHTML = '<i class="fas fa-camera"></i> COBERTURA: ' + ev.cobertura;
        
        // Manejo de la Portada
        const imgElement = document.getElementById('det-img');
        if (ev.imagen) {
            imgElement.src = ev.imagen;
            imgElement.style.display = 'block';
        } else {
            imgElement.style.display = 'none';
        }

        // Manejo del Documento Word
        // Manejo de Botones de Descarga
        const descargasDiv = document.getElementById('det-descargas');
        descargasDiv.innerHTML = '';
        
        // 1. Botón de Word (Si existe)
        if(ev.documento_url){
            descargasDiv.innerHTML += `<a href="${ev.documento_url}" download class="btn-descarga"><i class="fas fa-file-word"></i> Descargar Word</a>`;
        }
        
        // 2. Botón del SUPER PACK ZIP (Aparece siempre)
        descargasDiv.innerHTML += `<a href="/agenda/descargar-pack/${ev.id}/" class="btn-pack"><i class="fas fa-file-archive"></i> Descargar Pack de Medios (ZIP)</a>`;

        // Manejo de la Galería de fotos múltiples
        const galeriaDiv = document.getElementById('det-galeria');
        const galeriaTitle = document.getElementById('galeria-title');
        galeriaDiv.innerHTML = '';
        
        if(ev.galeria && ev.galeria.length > 0){
            galeriaTitle.style.display = 'block';
            ev.galeria.forEach(url => {
                // Al hacer clic en una miniatura, la ponemos como imagen principal (portada)
                galeriaDiv.innerHTML += `<img src="${url}" onclick="document.getElementById('det-img').src='${url}'" alt="Foto galería">`;
            });
        } else {
            galeriaTitle.style.display = 'none';
        }

        toggleModal('detailModal');
    }

    window.onclick = (e) => { if(e.target.classList.contains('modal-fr')) e.target.classList.remove('active'); }
    updateCalendar();
</script>
{% endblock %}
